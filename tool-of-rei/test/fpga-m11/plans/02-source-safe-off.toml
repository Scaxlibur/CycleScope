[experiment]
name = "CycleScope M11 source safe OFF"
label = "cyclescope_m11_source_safe_off"

[safety]
scope_guard_channel = 1
require_scope_coupling_not = ["DC", "AC"]
allow_50ohm = false

[[steps]]
kind = "source.status"
channel = 1

[[steps]]
kind = "power.status"
channel = 1

[[steps]]
kind = "source.output"
channel = 1
state = "off"

[[steps]]
kind = "source.status"
channel = 1

[[steps]]
kind = "power.status"
channel = 1
